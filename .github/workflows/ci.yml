name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ------------------------------------------------------------------
  # Version Consistency Check
  # ------------------------------------------------------------------
  version-check:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version consistency
        run: |
          V_INIT=$(grep '__version__' gigacode/__init__.py | head -1 | sed 's/.*"\(.*\)".*/\1/')
          V_TOML=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          V_FILE=$(cat VERSION | tr -d '[:space:]')
          echo "__init__.py: $V_INIT"
          echo "pyproject.toml: $V_TOML"
          echo "VERSION: $V_FILE"
          if [ "$V_INIT" != "$V_TOML" ] || [ "$V_INIT" != "$V_FILE" ]; then
            echo "ERROR: Version mismatch!"
            exit 1
          fi
          echo "Version consistent: $V_INIT"

  # ------------------------------------------------------------------
  # Lint & Format (fast feedback)
  # ------------------------------------------------------------------
  lint:
    name: Lint & Format
    needs: [version-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Upgrade build toolchain
        run: python -m pip install --upgrade pip setuptools wheel build

      - name: Install dev dependencies
        run: pip install ".[dev]"

      - name: Lint with Ruff
        run: ruff check --output-format=github gigacode/ tests/

      - name: Check formatting with Ruff
        run: ruff format --check gigacode/ tests/

  # ------------------------------------------------------------------
  # Build Verification (wheel & sdist)
  # ------------------------------------------------------------------
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Upgrade build toolchain
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build wheel & sdist
        run: python -m build

      - name: Check wheel with Twine
        run: twine check dist/*

      - name: Verify wheel installs, resolves, and runs (core profile)
        run: |
          python -m venv .venv-test
          .venv-test/bin/python -m pip install dist/*.whl
          .venv-test/bin/python -m pip check
          .venv-test/bin/python scripts/smoke_test.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.run_id }}
          path: dist/
          retention-days: 7

  # ------------------------------------------------------------------
  # Wheel smoke tests for supported installation profiles
  # ------------------------------------------------------------------
  wheel-smoke:
    name: Wheel Smoke (${{ matrix.extras || 'core' }})
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extras: ["", "server", "mcp"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.run_id }}
          path: dist/

      - name: Install wheel with profile extras
        shell: bash
        run: |
          python -m venv .venv-smoke
          WHL=$(ls dist/*.whl | head -1)
          if [ "${{ matrix.extras }}" = "" ]; then
            .venv-smoke/bin/python -m pip install "$WHL"
          else
            .venv-smoke/bin/python -m pip install "gigacode[${{ matrix.extras }}] @ file://$PWD/$WHL"
          fi
          .venv-smoke/bin/python -m pip check

      - name: Smoke test installed wheel
        run: .venv-smoke/bin/python scripts/smoke_test.py

  # ------------------------------------------------------------------
  # Documentation Build (Sphinx)
  # ------------------------------------------------------------------
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install ".[docs]"

      - name: Build documentation with Sphinx
        run: |
          cd docs
          sphinx-build -M html . _build -W --keep-going

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docs-html-${{ github.run_id }}
          path: docs/_build/html/
          retention-days: 30

  # ------------------------------------------------------------------
  # Tests (cross-platform, cross-version)
  # ------------------------------------------------------------------
  test:
    name: Test ${{ matrix.os }} / Py${{ matrix.python-version }}
    needs: [lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            coverage: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Upgrade build toolchain
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: pip install ".[test]"

      - name: Test with pytest
        run: pytest tests/ -v --tb=short

      - name: Test with coverage
        if: matrix.coverage
        run: |
          pytest tests/ -v --tb=short \
            --cov=gigacode --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: matrix.coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run smoke benchmarks
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python benchmark.py --dir examplecode/ --search-iters 5 --edit-iters 1 || true

  # ------------------------------------------------------------------
  # Embedding profile smoke test (manual / heavy)
  #
  # Downloads a real embedding model (~160MB) and the torch/faiss stack, so it
  # runs only on workflow_dispatch rather than on every push.
  # ------------------------------------------------------------------
  embed-smoke:
    name: Embed Profile (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install embed + test extras
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install ".[embed,test]"

      - name: pip check
        run: python -m pip check

      - name: Functional smoke test (core workflow with real deps installed)
        run: python scripts/smoke_test.py

      - name: Real embedding model loads and reports its dimension
        run: |
          python -c "from gigacode.embedder import Embedder; e = Embedder(); print('embedding_dim=', e.embedding_dim); assert e.embedding_dim > 0"

  # ------------------------------------------------------------------
  # Security Scan
  # ------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit
        run: bandit -r gigacode/ -f json -o bandit-report.json || true

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore
