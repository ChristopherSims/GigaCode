[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gigacode"
version = "0.8.0"
description = "GPU-accelerated code embedding and semantic search for AI agents"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "GigaCode Team"}
]
keywords = [
    "code-embedding",
    "semantic-search",
    "gpu-acceleration",
    "faiss",
    "ast-chunking",
    "code-intelligence"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    # >=1.24 keeps compatibility with NGC PyTorch images built against numpy 1.x;
    # the code uses no numpy-2-only APIs.
    "numpy>=1.24",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-c>=0.23.0",
    "filelock>=3.13.0",
]

[project.optional-dependencies]
embed = [
    "torch>=2.0.0",
    "sentence-transformers>=5.0.0",
    "transformers>=5.8.0",
    "scikit-learn>=1.6.0",
    "faiss-cpu>=1.8.0",
]
gpu = [
    "gigacode[embed]",
    # PyPI's legacy faiss-gpu does not resolve on current Python/CUDA; the
    # community CUDA 12 build is the supported pip path on Linux.
    "faiss-gpu-cu12>=1.8.0; sys_platform == 'linux'",
]
server = [
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.39.0",
    "pydantic>=2.13.0",
    "watchdog>=6.0.0",
    "prometheus-client>=0.22.0",
]
mcp = [
    # 1.x is the supported API surface (2.x changed Server/CallToolResult).
    "mcp>=1.27.1,<2",
]
all = [
    "gigacode[embed,server,mcp]",
]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.12",
    "mypy>=1.8.0",
]
# Dependencies required to run the full test suite.  Intentionally excludes the
# heavy embedding stack (torch / sentence-transformers / faiss) so CI stays
# fast; the embedding interface is exercised with lightweight doubles, and
# tests that need the real stack opt in via importorskip.
test = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.12",
    "mypy>=1.8.0",
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.39.0",
    "pydantic>=2.13.0",
    "watchdog>=6.0.0",
    "prometheus-client>=0.22.0",
    "mcp>=1.27.1,<2",
    "scikit-learn>=1.6.0",
    "httpx>=0.27.0",
]
docs = [
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=2.0.0",
]

[project.scripts]
gigacode = "gigacode.__main__:main"
gigacode-server = "gigacode.gigacode_server:main"
gigacode-mcp = "gigacode.mcp_server:main"
gigacode-skill = "gigacode.gigacode_skill:main"

[project.urls]
Homepage = "https://github.com/gigacode-ai/gigacode"
Repository = "https://github.com/gigacode-ai/gigacode.git"
Documentation = "https://github.com/gigacode-ai/gigacode#readme"
Changelog = "https://github.com/gigacode-ai/gigacode/blob/main/CHANGELOG.md"
Issues = "https://github.com/gigacode-ai/gigacode/issues"

[tool.setuptools.packages.find]
include = ["gigacode*"]
exclude = ["tests*", "scripts*", "examplecode*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
gigacode = ["gigacode.toml.example"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by ruff formatter)
    "B008",  # do not perform function calls in argument defaults
    "W293",  # blank line contains whitespace (docstrings)
    "F841",  # local variable assigned but never used (stubs, TODOs)
    "F401",  # imported but unused (re-exports, backward compat)
    "C901",  # function too complex (legacy code, to be refactored)
]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    ".eggs",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]
markers = [
    "integration: integration tests",
    "slow: slow tests",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
# Allow gradual typing — many legacy methods return Any.
# This project has extensive type hints but also many modules written before
# strict typing was enforced.  Mypy runs as an advisory check in CI.
disable_error_code = [
    "no-any-return",
    "union-attr",
    "attr-defined",
    "arg-type",
    "return-value",
    "assignment",
    "var-annotated",
    "list-item",
    "dict-item",
    "has-type",
    "misc",
    "call-arg",
    "no-redef",
    "operator",
    "index",
    "comparison-overlap",
    "str-bytes-safe",
    "valid-type",
    "override",
    "abstract",
    "safe-super",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "func-returns-value",
    "call-overload",
    "unused-awaitable",
    "return",
    "annotation-unchecked",
]

[tool.coverage.run]
source = ["gigacode"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
