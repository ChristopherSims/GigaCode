# Merge the mcp_servers block below into ~/.hermes/config.yaml
# (Hermes Agent reads MCP config from there; credentials go in ~/.hermes/.env)
mcp_servers:
  gigacode:
    command: gigacode-mcp
    args:
      - --work-dir
      - /absolute/path/to/.gigacode-buffers
      - --tool-profile
      - agent_core
    enabled: true
    timeout: 300
    tools:
      include: []
      exclude: []
